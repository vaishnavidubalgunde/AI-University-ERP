services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-erp-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=supersecretjwtkey_production_grade_university_erp_2026
      - DATABASE_URL=sqlite:///./university_erp.db
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - RAG_PERSIST_DIRECTORY=./data/vector_store
    volumes:
      - erp-db-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-erp-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  erp-db-data:
    driver: local
